<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quotes App</title>
    <link rel="shortcut icon" href="images/7505284.png" type="image/x-icon">
    <link rel="stylesheet" href="CSS/bootstrap.min.css" />
    <link rel="stylesheet" href="CSS/main.css" />
  </head>
  <body>
   <section class="d-flex justify-content-center align-items-center"> 
    <div
    class="container bg-white rounded-5 d-flex flex-column justify-content-center align-items-center"
  >
    <h1 class="mt-5 display-1 fw-bolder">Quote of the Day</h1>
    <p class="my-4 fs-2 fw-medium">Press the button below to recieve a random quote!</p>
    <button onclick="Quote()" class="btn btn-1 button fs-4">New Quote</button>
    <p id="quote" class="fs-2 mt-4"></p>
    <p id="author" class="fs-2 my-3"></p>
  </div>
   </section>
    <script src="JS/bootstrap.bundle.min.js"></script>
    <script src="JS/main.js"></script>
  </body>
</html>
